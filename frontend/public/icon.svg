<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="top" x1="128" y1="34" x2="128" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#79b8ff"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="mid" x1="128" y1="96" x2="128" y2="166" gradientUnits="userSpaceOnUse">
